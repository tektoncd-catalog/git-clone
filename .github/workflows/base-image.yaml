name: Base Image

on:
  push:
    branches: [main]
    paths: ['image/base/**']
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday — catch upstream updates
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  build:
    name: Build and push base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image/base
          push: true
          platforms: linux/amd64,linux/s390x,linux/ppc64le,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/base:latest
            ghcr.io/${{ github.repository }}/base:${{ github.sha }}
